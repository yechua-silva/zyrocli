name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.0.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build npm package
        run: |
          mkdir -p dist/npm/bin dist/npm/scripts
          cp scripts/npm/package.json dist/npm/
          cp scripts/npm/README.md dist/npm/
          cp scripts/npm/bin/zyrocli.js dist/npm/bin/
          cp scripts/npm/scripts/postinstall.js dist/npm/scripts/

      - name: Check version and publish
        run: |
          cd dist/npm
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PKG_VERSION"
          
          # Verificar si la versión ya existe en npm
          if npm view zyrocli@$PKG_VERSION version &>/dev/null; then
            echo "ℹ️ Versión $PKG_VERSION ya existe en npm. Skip."
          else
            echo "📦 Publicando $PKG_VERSION..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
