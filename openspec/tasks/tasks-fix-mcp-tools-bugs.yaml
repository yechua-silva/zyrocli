  - id: "MCP-14"
    name: "Eliminar mcp-tools/runner.py deprecado"
    description: >
      Eliminar `mcp-tools/runner.py` del proyecto raíz. Este archivo
      tiene imports rotos y no es usado por nadie:
      - opencode.json referencia `~/.config/zyrocli/mcp-tools/runner.py` (LIVE)
      - El entry point real es `agent.py`
      - La canónica en `internal/opencode/mcptools/runner.py` se conserva
      Bug #7 del diseño.
      Verificar que no hay referencias a `mcp-tools/runner.py` en
      scripts, Makefile, opencode.json.
    files:
      - "mcp-tools/runner.py"
    estimated_effort: "small"
    dependencies: []
    acceptance_criteria:
      - "`mcp-tools/runner.py` no existe en el sistema de archivos"
      - "Ninguna referencia a `mcp-tools/runner.py` en Makefile, scripts, o docs del proyecto"
      - "`internal/opencode/mcptools/runner.py` NO se elimina (se conserva)"

  - id: "MCP-15"
    name: "Sincronizar LIVE ~/.config/zyrocli/mcp-tools/ + agregar make target"
    description: >
      Sincronizar la copia LIVE con la canónica post-fixes:
      ```
      cp internal/opencode/mcptools/*.py ~/.config/zyrocli/mcp-tools/
      ```
      Además, agregar target `make sync-mcptools` en el Makefile del
      proyecto que automatice la sincronización entre canonical y
      proyecto raíz:
      ```makefile
      sync-mcptools:
      \tfor f in helix_client.py search_facts.py search_code.py search_skills.py helix_write.py task_context.py runner.py; do
      \t\tcp internal/opencode/mcptools/$$$$f mcp-tools/$$$$f
      \tdone
      ```
    files:
      - "~/.config/zyrocli/mcp-tools/"
      - "Makefile"
    estimated_effort: "small"
    dependencies:
      - "MCP-08"
      - "MCP-09"
      - "MCP-10"
      - "MCP-11"
      - "MCP-12"
      - "MCP-13"
      - "MCP-14"
    acceptance_criteria:
      - "`diff internal/opencode/mcptools/*.py ~/.config/zyrocli/mcp-tools/` retorna vacío (todos los pares)"
      - "`make sync-mcptools` existe y ejecuta cp de todos los archivos de canonical a mcp-tools/"
      - "Puede ejecutarse `make sync-mcptools` sin errores"

