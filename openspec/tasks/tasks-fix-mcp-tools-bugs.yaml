  # FASE A: Fixes en copia canónica (internal/opencode/mcptools/)
  # ═══════════════════════════════════════════════════════════════

  - id: "MCP-01"
    name: "Agregar parámetro `property` a `text_search()` en canonical helix_client.py"
    description: >
      Modificar la firma de `HelixClient.text_search()` en
      `internal/opencode/mcptools/helix_client.py` para aceptar
      `property: str = "name"`. Cambiar el body para usar el parámetro
      en vez del hardcode `"property": "name"`.
      Bug #1 del diseño.
    files:
      - "internal/opencode/mcptools/helix_client.py"
    estimated_effort: "small"
    dependencies: []
    acceptance_criteria:
      - "Firma: `async def text_search(self, label, query, limit=10, property='name')`"
      - "Body usa `'property': property` en vez de `'property': 'name'`"
      - "text_search('Fact', 'test', property='content') envía property=content en la query"
      - "text_search('Skill', 'python') sin property usa default 'name' (backward compat)"
      - "Test inline: `inspect.signature(HelixClient.text_search).parameters` contiene 'property' con default 'name'"

  - id: "MCP-02"
    name: "Agregar `_get_properties`, `_clean_props` y `ProjectReturn` en canonical helix_client.py"
    description: >
      Agregar métodos privados `_get_properties()` y `_clean_props()` en
      `internal/opencode/mcptools/helix_client.py`. Agregar step
      `ProjectReturn` con 8 fields (id, name, content, language, path,
      summary, description, source) después de `TextSearchNodes`.
      Cambiar retorno de text_search de `[{"id": i}]` a
      `self._get_properties(result, "n")`.
      Bugs #5 y #6 del diseño.
    files:
      - "internal/opencode/mcptools/helix_client.py"
    estimated_effort: "medium"
    dependencies: ["MCP-01"]
    acceptance_criteria:
      - "Método `_clean_props(p: dict) -> dict` normaliza: `$id` → `id`, elimina claves `$*` internas"
      - "Método `_get_properties(result, name) -> list[dict]` extrae properties completas de respuesta v3"
      - "Si result no tiene properties, fallback a `[{'id': i}]` (backward compat)"
      - "text_search retorna dicts con id, name, content, etc. (no solo `{'id': i}`)"
      - "Falsy ID fix: `$id=0` retorna correctamente `[0]` (no se omite por falsy)"
      - "Test inline: `c._get_ids({'n': {'properties': [{'$id': 0}]}})` retorna `[0]`"

  - id: "MCP-03"
    name: "Agregar `include_properties` a `get_node()` en canonical helix_client.py"
    description: >
      Extender `HelixClient.get_node()` en
      `internal/opencode/mcptools/helix_client.py` con parámetro
      `include_properties: bool = False`. Cuando es True, agregar step
      `ProjectReturn` en la query POST y retornar properties completas
      incluyendo `acceptance_criteria`.
      Ver diseño sección 4.5.
    files:
      - "internal/opencode/mcptools/helix_client.py"
    estimated_effort: "small"
    dependencies: ["MCP-02"]
    acceptance_criteria:
      - "Firma: `async def get_node(self, label, id, include_properties=False)`"
      - "include_properties=False (default): retorna `{'id': id}` (backward compat)"
      - "include_properties=True: retorna dict con id, name, description, acceptance_criteria, etc."
      - "Callers existentes (agent.py, task_context.py) sin cambio de comportamiento"

  - id: "MCP-04"
    name: "Agregar edge label fallback helpers en canonical helix_client.py"
    description: >
      Agregar constante `EDGE_LABEL_FALLBACKS` a nivel módulo y métodos
      `get_outgoing_with_fallback()` / `get_incoming_with_fallback()`
      en `HelixClient`. Mapea labels canónicos a legacy:
      `has_skill → REQUIRES_SKILL`, `has_code → REFERENCES`.
      Bug #8 del diseño.
    files:
      - "internal/opencode/mcptools/helix_client.py"
    estimated_effort: "small"
    dependencies: []
    acceptance_criteria:
      - "`EDGE_LABEL_FALLBACKS` define `has_skill: ['REQUIRES_SKILL']` y `has_code: ['REFERENCES']`"
      - "`get_outgoing_with_fallback(node_id, 'has_skill')` intenta 'has_skill' primero, fallback a 'REQUIRES_SKILL'"
      - "`get_incoming_with_fallback(node_id, 'has_skill')` análogo para incoming"
      - "Si label canónico retorna datos, NO consulta legacy"
      - "Si todos vacíos, retorna `[]`"
      - "Test inline: `EDGE_LABEL_FALLBACKS['has_skill'] == ['REQUIRES_SKILL']`"

  - id: "MCP-05"
    name: "Fix `search_facts.py` canonical para usar `property='content'`"
    description: >
      En `internal/opencode/mcptools/search_facts.py`, cambiar la
      llamada a `text_search("Fact", query, limit=limit)` por
      `text_search("Fact", query, limit=limit, property="content")`.
      Esto permite que la búsqueda de Facts busque en el campo
      `content` (donde realmente se almacena el texto) en vez de `name`.
      Bug #3 del diseño.
    files:
      - "internal/opencode/mcptools/search_facts.py"
    estimated_effort: "small"
    dependencies: ["MCP-01"]
    acceptance_criteria:
      - "`search_facts_tool` llama `client.text_search('Fact', query, limit=limit, property='content')`"
      - "`search_facts('auth')` busca en campo `content` de nodos Fact"
      - "Sin cambios en firma de `search_facts_tool` (sigue aceptando query, limit)"
      - "Test inline: import search_facts_tool, ejecutar con query de prueba"

  - id: "MCP-06"
    name: "Fix `task_context.py` canonical: acceptance_criteria + edge fallback"
    description: >
      En `internal/opencode/mcptools/task_context.py`:
      1. Cambiar `client.get_node("Task", id)` por
         `client.get_node("Task", id, include_properties=True)`
      2. Extraer `acceptance_criteria` del task_node
      3. Reemplazar `client.get_outgoing(id, "has_skill")` por
         `client.get_outgoing_with_fallback(id, "has_skill")`
         (y análogos para has_code, has_doc, has_pattern, depends_on)
      4. Agregar campo `"acceptance_criteria"` en el JSON de retorno
      Bugs: #8 y AC del diseño.
    files:
      - "internal/opencode/mcptools/task_context.py"
    estimated_effort: "medium"
    dependencies: ["MCP-03", "MCP-04"]
    acceptance_criteria:
      - "Llama `get_node('Task', id, include_properties=True)`"
      - "Extrae `acceptance_criteria` del task_node (o `[]` si no existe)"
      - "Usa `get_outgoing_with_fallback(id, 'has_skill')` en vez de `get_outgoing(id, 'has_skill')`"
      - "Usa `get_outgoing_with_fallback(id, 'has_code')` en vez de `get_outgoing(id, 'has_code')`"
      - "Respuesta JSON incluye campo `acceptance_criteria`"
      - "Respuesta JSON incluye 7 secciones: task_id, acceptance_criteria, skills, code, docs, patterns, dependents, dependencies"

  - id: "MCP-07"
    name: "Fix `helix_write.py` canonical: labels y REQUIRED_FIELDS"
    description: >
      En `internal/opencode/mcptools/helix_write.py`:
      1. Cambiar `"CodeModule"` por `"CodeNode"` en REQUIRED_FIELDS
      2. Agregar entradas faltantes: `"Fact"`, `"Project"`,
         `"CodeNode"` (si no existe), `"Document"`
      Bugs #2 y #4 del diseño.
    files:
      - "internal/opencode/mcptools/helix_write.py"
    estimated_effort: "small"
    dependencies: []
    acceptance_criteria:
      - "`REQUIRED_FIELDS` contiene `'CodeNode': ['path', 'language', 'summary']`"
      - "`REQUIRED_FIELDS` NO contiene `'CodeModule'`"
      - "`REQUIRED_FIELDS` contiene `'Fact': ['content', 'source']`"
      - "`REQUIRED_FIELDS` contiene `'Project': ['name', 'path']`"
      - "`REQUIRED_FIELDS` contiene `'Document': ['topic_key', 'doc_type', 'content']`"
      - "Test inline: import REQUIRED_FIELDS, assert all labels presentes"

